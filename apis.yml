aid: dryft
name: Dryft
description: >-
  Dryft, Inc. is a Palo Alto, California startup building an AI operating system
  for manufacturing operations. The platform pairs context-aware, agent-based
  intelligence with mathematical optimization to mimic, optimize, and automate
  complex human decisions across the shop floor and supply chain. Dryft reads
  operational data from existing ERPs and inventory systems, identifies issues
  such as late items or stockouts, and autonomously recommends and executes
  actions like adjusting order quantities and safety stocks or following up with
  suppliers. The company frames this as a shift from static Enterprise Resource
  Planning to Enterprise Resource Automation, freeing planners to focus on
  strategy over administrative work. Founded in 2024 by CEO Anna-Julia Storch
  and CTO Leonie Freisinger, Dryft raised a $5M round led by General Catalyst
  with participation from Neo and Sandberg Bernthal Venture Partners. Dryft does
  not currently publish a public developer API, SDKs, or documentation; this
  profile captures its company identity in the API Evangelist network.
